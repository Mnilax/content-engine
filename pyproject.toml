[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-engine"
version = "0.1.0"
description = "Social content repurposing engine — source + article → quote-tweet, thread, QRT, summary card via Anthropic API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
